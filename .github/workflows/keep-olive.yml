name: Supabase Keep Alive

on:
  schedule:
    # Runs every 3 days at midnight UTC
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -i -X GET '${{ secrets.SUPABASE_URL }}/rest/v1/' \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
